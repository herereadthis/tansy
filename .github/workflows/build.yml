name: Build & Push
description: Build and push the Docker image to the registry.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref: branch|tag|SHA'
        type: string
        required: false
        default: build
      push-image:
        description: 'Push image to registry'
        type: boolean
        required: false
        default: false
  push:
    branches:
      - main
    tags:
      - '*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get ref
        id: ref
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "branch" ]]; then
            echo "ref=main" >> $GITHUB_OUTPUT
            echo "docker-tag=latest" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            echo "ref=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "docker-tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else 
            echo "ref=${{ github.event.inputs.ref }}" >> $GITHUB_OUTPUT
            echo "docker-tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.ref.outputs.ref }}
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v6
      - name: install Poetry
        run: pipx install poetry==2.3.2
      - name: install dependencies
        run: poetry install
      - name: run tests
        run: |
          poetry run nox -s tests
      - name: lint
        run: |
          poetry run nox -s lint
      - name: Docker meta
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: options
        id: options
        run: |
          echo "ref=${{ steps.ref.outputs.ref }}" >> $GITHUB_OUTPUT
          echo "python-version=${{ steps.setup-python.outputs.python-version }}" >> $GITHUB_OUTPUT
          echo "build-number=${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Manual Build and push
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v6
        with:
          push: ${{ github.event.inputs.push-image }}
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
      - name: Build and push tag
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          labels: ${{ steps.docker-meta.outputs.labels }}
      - name: Build and push main
        if: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          labels: ${{ steps.docker-meta.outputs.labels }}
      - name: step summary
        uses: actions/github-script@v7
        with:
          script: |
            const json = {
              options: ${{ toJSON(steps.options.outputs) }},
              meta: ${{ toJSON(steps.docker-meta.outputs) }}
            };
            const name = 'docker/metadata-action';
            if (name !== '') {
              core.summary.addHeading(name, 3);
            }
            core.summary.addCodeBlock(JSON.stringify(json, null, 4), 'json');
            core.summary.addEOL();
            core.summary.write();
