[project]
name = "montecarlo_pi"
version = "0.1.0"
description = "monte carlo simulation to calculate pi"
authors = [
    {name = "AUTHOR_NAME",email = "author_name.github@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy (>=2.4.0,<3.0.0)"
]

[project.scripts]
montecarlo-pi = "montecarlo_pi.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pylint = "^4.0.4"
nox = "^2025.11.12"

[tool.pylint]
max-line-length = 120

[tool.pytest.ini_options]
addopts = "-s"

