[project]
name = "montecarlo_pi"
version = "0.1.0"
description = "monte carlo simulation to calculate pi"
authors = [
    {name = "AUTHOR_NAME",email = "author_name.github@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer[all] (==0.16.0)",
    "numpy (>=2.4.0,<3.0.0)"
]

[project.scripts]
montecarlo-pi = "montecarlo_pi.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
